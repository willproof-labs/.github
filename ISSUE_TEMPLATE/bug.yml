name: Bug
description: Something does not work as documented / Quelque chose ne marche pas comme documenté
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Never paste machine names, user names, personal paths or secrets.
        Ne collez jamais de nom de machine, d'utilisateur, de chemin personnel ni de secret.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Étapes pour reproduire
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour / Comportement attendu et observé
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output (cleaned) / Sortie (nettoyée)
      render: text
  - type: input
    id: environment
    attributes:
      label: Version and OS family / Version et famille d'OS
